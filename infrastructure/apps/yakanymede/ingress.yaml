apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yakanymede-api
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: ${ACME_ISSUER}
    # the encyclopaedia import can be slow when dofusdb is in a mood
    ingress.cilium.io/request-timeout: "60"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - yakanymede.${PUBLIC_DOMAIN}
      secretName: yakanymede-api-tls
  rules:
    - host: yakanymede.${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yakanymede-api
                port:
                  number: 8787

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trilium
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: trilium
      version: "2.0.0"
      sourceRef:
        kind: HelmRepository
        name: trilium
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: trilium

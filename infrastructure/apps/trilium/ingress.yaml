apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: ${ACME_ISSUER}
    ingress.cilium.io/request-timeout: "300"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - trilium.${PUBLIC_DOMAIN}
      secretName: trilium-tls
  rules:
    - host: trilium.${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trilium
                port:
                  number: 8080

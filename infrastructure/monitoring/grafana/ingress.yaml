apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: ${ACME_ISSUER}
    # Cilium defaults to no backend timeout at all, which lets slow requests pin Envoy workers.
    ingress.cilium.io/request-timeout: "30"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - grafana.${PUBLIC_DOMAIN}
      secretName: grafana-tls
  rules:
    - host: grafana.${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.48.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: vmsingle
    server:
      retentionPeriod: 14d
      persistentVolume:
        enabled: true
        size: 10Gi
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
      scrape:
        enabled: true

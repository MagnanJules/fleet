---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.19.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true # conserving in case of pb
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
    cainjector:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
